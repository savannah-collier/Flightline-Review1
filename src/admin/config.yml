backend:
  name: git-gateway
  branch: main

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "src/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Byline", name: "author", widget: "string", default: "Savannah Collier" }
      - { label: "Dek / Subhead", name: "dek", widget: "string", hint: "One sentence — shows under the headline on the Stories page." }
      - label: "Tag"
        name: "tag"
        widget: "select"
        options: ["FEATURE", "SAFETY", "PROFILE", "MAINTENANCE", "EXPLAINER"]
      - { label: "Article Body", name: "body", widget: "markdown" }
